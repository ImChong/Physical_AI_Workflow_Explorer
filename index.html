<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physical AI Workflow Explorer</title>
  <meta name="description" content="Explore how a humanoid robot task moves from data → simulation → robot learning → edge deployment." />
  <script>
    /* Apply a saved theme before first paint to avoid a flash. */
    try {
      var t = JSON.parse(localStorage.getItem("pawe:theme"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/workflow">Physical AI Workflow Explorer</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/workflow" data-view="workflow" data-i18n="tab.workflow">Explore Workflow</a>
        <a href="#/budget" data-view="budget" data-i18n="tab.budget">Deployment Budget</a>
        <a href="#/sim2real" data-view="sim2real" data-i18n="tab.sim2real">Debug Sim2Real</a>
        <a href="#/ai" data-view="ai"><span data-i18n="tab.ai">Design with AI</span> <small class="soon-tag" data-i18n="tab.soon">soon</small></a>
      </nav>
      <div class="header-tools">
        <button type="button" class="icon-btn lang-btn" id="lang-toggle">中文</button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme">☾</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 data-i18n-html="hero.title"></h1>
      <p class="muted" data-i18n="hero.sub"></p>
      <ol class="stage-strip" id="stage-strip"></ol>
    </section>

    <!-- ============ WORKFLOW ============ -->
    <section class="view" id="view-workflow">
      <div class="toolbar">
        <label class="field">
          <span data-i18n="wf.task">Task</span>
          <select id="task-select"></select>
        </label>
        <label class="switch">
          <input type="checkbox" id="engineer-toggle" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span data-i18n="wf.engineer">Engineer Mode</span>
        </label>
        <div class="legend">
          <span class="badge core" data-i18n="status.core">core</span>
          <span class="badge optional" data-i18n="status.optional">optional</span>
          <span class="badge skip" data-i18n="status.skip">skip</span>
        </div>
      </div>

      <div class="workflow-grid">
        <div class="pipeline" id="pipeline" role="list"></div>
        <aside class="detail" id="detail" aria-live="polite"></aside>
      </div>
    </section>

    <!-- ============ BUDGET ============ -->
    <section class="view" id="view-budget" hidden>
      <h2 data-i18n="b.title"></h2>
      <p class="muted" data-i18n-html="b.sub"></p>

      <div class="budget-grid">
        <div class="card">
          <h3 data-i18n="b.inputs"></h3>
          <div id="budget-inputs" class="budget-inputs"></div>
          <div class="budget-row">
            <label class="field">
              <span data-i18n="b.target"></span>
              <input type="number" id="budget-target" min="1" max="1000" step="1" value="50" />
            </label>
            <label class="field">
              <span data-i18n="b.mode"></span>
              <select id="budget-mode">
                <option value="sequential" data-i18n="b.seq"></option>
                <option value="pipelined" data-i18n="b.pipe"></option>
              </select>
            </label>
          </div>
          <div class="budget-row">
            <label class="field grow">
              <span><span data-i18n="b.speedup"></span> <output id="speedup-out">1×</output></span>
              <input type="range" id="budget-speedup" min="1" max="6" step="0.1" value="1" />
            </label>
          </div>
          <p class="note" data-i18n-html="b.speedupNote"></p>
        </div>

        <div class="card">
          <h3 data-i18n="b.result"></h3>
          <div id="budget-result"></div>
          <h4 data-i18n="b.bottlenecks"></h4>
          <div id="budget-bars" class="bars"></div>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="b.optPath"></h3>
        <div id="opt-path" class="opt-path"></div>
        <div id="opt-advice"></div>
      </div>
    </section>

    <!-- ============ SIM2REAL ============ -->
    <section class="view" id="view-sim2real" hidden>
      <h2 data-i18n="s.title"></h2>
      <p class="muted" data-i18n="s.sub"></p>
      <div class="symptoms" id="symptoms"></div>
      <div class="s2r-grid">
        <div class="causes" id="causes"></div>
        <div class="cause-detail" id="cause-detail"></div>
      </div>
    </section>

    <!-- ============ AI (placeholder) ============ -->
    <section class="view" id="view-ai" hidden>
      <div class="card soon">
        <h2 data-i18n="ai.title"></h2>
        <p data-i18n="ai.p1"></p>
        <p class="muted" data-i18n="ai.p2"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n-html="footer.main"></p>
      <p class="related">
        <span data-i18n="footer.related">Related:</span>
        <a href="https://imchong.github.io/Robotics_Notebooks/">Robotics Notebooks</a> ·
        <a href="https://imchong.github.io/Robot_Description_Gallery_Online/">Robot Description Gallery</a> ·
        <a href="https://imchong.github.io/Robot_Retarget_Online/">Robot Retarget Online</a> ·
        <a href="https://imchong.github.io/Robot_Learning_Sim2Sim_Online/">Sim2Sim Online</a> ·
        <a href="https://imchong.github.io/Robot_Learning_IO_Board_Online/">Policy I/O Board</a> ·
        <a href="https://imchong.github.io/Robot_Joint_Order_Check_Tool_Online/">Joint Order Check Tool</a>
      </p>
    </div>
  </footer>

  <script src="assets/js/workflow-data.js"></script>
  <script src="assets/js/sim2real-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/content-zh.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
